name: CI

on:
  push:
    branches:
      - main

    paths:
      - '.github/workflows/**'
      - 'Cargo**'
      - 'src/**/*.rs'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Targets the Lambda runtime (provided.al2023 on ARM64) from the start, so CI
  # validates the architecture the service actually deploys to. Packaging and
  # deployment are deliberately absent until there is something to deploy.
  ci:
    uses: jluszcz/github-utils/.github/workflows/rust-ci.yml@v2
    with:
      runs-on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
